[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gozu"
version = "0.3.6"
description = "Scan code with a pluggable choice of scanners (currently SonarQube and Trivy) and auto-create tickets in a pluggable choice of ticket-tracking backends (currently Jira), orchestrated with Temporal."
requires-python = ">=3.12"
dependencies = [
    "flask",
    "requests",
    "temporalio",
    "pydantic",
    "cryptography",
    "psycopg[binary]",
    "typer",
    "questionary",
    "rich",
    "alembic>=1.19.2",
    "pygments>=2.21.0",
    "pillow>=12.3.0",
    "anthropic>=1.4.0",
]

[project.scripts]
gozu = "cli.main:main"
gozu-github-action = "github_action.main:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.uv]
# `uv sync` (bare) still installs `dev` locally; a Docker build passes
# --no-group dev explicitly (see Dockerfile) since pytest has no reason
# to be in a shipped worker/receiver image.
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
# Every real Python package lives under src/. `packages` (not `include`)
# strips the leading `src/` so each lands as a top-level importable
# package - `cli`, `scanner`, etc, not `src.cli` - so every absolute
# import in this codebase resolves unchanged whether gozu runs from a
# checkout or a built wheel. src/dev/ (dev-only scripts) and everything
# outside src/ stay out of the wheel entirely.
packages = [
    "src/core",
    "src/scanner",
    "src/ticket",
    "src/temporal",
    "src/receiver",
    "src/cli",
    "src/scripts",
    "src/config",
    "src/github_action",
    "src/llm",
]
