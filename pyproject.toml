[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gozu"
version = "0.3.4"
description = "Scan code with SonarQube and auto-create Jira tickets for vulnerabilities, orchestrated with Temporal."
requires-python = ">=3.12"
dependencies = [
    "flask",
    "requests",
    "temporalio",
    "pydantic",
    "cryptography",
    "psycopg[binary]",
    "typer",
    "questionary",
    "rich",
    "alembic>=1.19.2",
    "pygments>=2.21.0",
    "pillow>=12.3.0",
    "anthropic>=1.4.0",
]

[project.scripts]
gozu = "cli.main:main"
gozu-github-action = "github_action.main:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.uv]
# `uv sync` (bare) still installs `dev` locally, same as before this split -
# only a Docker build (which passes --no-group dev explicitly, see
# Dockerfile) skips it. pytest has no reason to be in a shipped
# worker/receiver image at all - it was never imported by any of them.
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
# An allowlist, not an exclude list - anything not matching one of these
# patterns (tests/, CLAUDE.md, dev/, ARCHITECTURE.md, ...) is structurally
# never in the wheel, with nothing to remember to keep excluded as the repo
# grows. scripts/** is included wholesale because every file actually left
# in scripts/ (bootstrap_env.py/env_ports.py/fernet_safety.py/paths.py) is
# genuinely runtime-needed - a throwaway/dev-only script (e.g. what used to
# be scripts/seed_test_config.py) belongs under dev/ instead, specifically
# because dev/ matches none of these patterns; don't add one back into
# scripts/ just because it's Python and lives near real code.
include = [
    "core/**",
    "scanner/**",
    "ticket/**",
    "temporal/**",
    "receiver/**",
    "cli/**",
    "scripts/**",
    "config/**",
    "github_action/**",
    "llm/**",
]
