[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gozu"
version = "0.2.3"
description = "Scan code with SonarQube and auto-create Jira tickets for vulnerabilities, orchestrated with Temporal."
requires-python = ">=3.12"
dependencies = [
    "flask",
    "requests",
    "temporalio",
    "pydantic",
    "playwright",
    "cryptography",
    "psycopg[binary]",
    "typer",
    "questionary",
]

[project.scripts]
gozu = "cli.main:app"

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.uv]
# `uv sync` (bare) still installs `dev` locally, same as before this split -
# only a Docker build (which passes --no-group dev explicitly, see
# Dockerfile) skips it. pytest has no reason to be in a shipped
# worker/receiver image at all - it was never imported by any of them.
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
include = [
    "core/**",
    "scanner/**",
    "ticket/**",
    "temporal/**",
    "receiver/**",
    "cli/**",
    "scripts/**",
    "config/**",
]
