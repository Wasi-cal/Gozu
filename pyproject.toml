[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gozu"
version = "0.2.3"
description = "Scan code with SonarQube and auto-create Jira tickets for vulnerabilities, orchestrated with Temporal."
requires-python = ">=3.12"
dependencies = [
    "flask",
    "requests",
    "temporalio",
    "pydantic",
    "playwright",
    "cryptography",
    "psycopg[binary]",
    "typer",
    "questionary",
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
gozu = "cli.main:app"
gozu-github-action = "github_action.main:main"

[tool.hatch.build.targets.wheel]
include = [
    "core/**",
    "scanner/**",
    "ticket/**",
    "temporal/**",
    "receiver/**",
    "cli/**",
    "scripts/**",
    "config/**",
    "github_action/**",
]
