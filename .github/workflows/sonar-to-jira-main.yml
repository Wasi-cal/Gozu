name: Sonar to Jira (main)

# Reacts to SonarQube Cloud's Automatic Analysis (which scans `main` on
# every push automatically, no scan step needed here - see
# docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis)
# by waiting for that analysis to land, then creating Jira tickets for new
# findings - see github_action/main.py.
#
# Deliberately scoped to `main` only: SonarQube Cloud's Free plan rejects
# querying issue data for any other branch ("Organization is not allowed
# to access data from non main branches" - confirmed live, see
# cli/scan_runner/scanner_exec.py's comment), so a PR-time equivalent of
# this workflow cannot work on Free.
#
# Runs entirely inside GitHub's own runner - unlike gozu's webhook trigger
# mode, this needs no receiver reachable from the public internet, only
# outbound calls to SonarQube Cloud's and Jira's APIs.

on:
  push:
    branches: [main]

concurrency:
  group: sonar-to-jira-main
  cancel-in-progress: false

jobs:
  create-tickets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Installs from this exact checkout, not a GitHub Release URL -
      # this repo is private, and pip has no credentials to fetch a
      # private repo's release asset (confirmed live: a plain
      # `pip install <release url>` 404s here even though the release
      # itself exists - GitHub returns 404, not 401/403, for a private
      # resource fetched unauthenticated). Installing from the checkout
      # also means this never drifts from whatever version is actually on
      # main. Swap for `pip install gozu` once this is published to PyPI.
      - name: Install gozu
        run: pip install .

      - name: Wait for analysis and create Jira tickets
        env:
          SCANNER_TYPE: sonarqube-cloud
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          TICKET_BACKEND: jira
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
          # Optional - blank/unset disables LLM-generated ticket explanations
          # for Blocker/Critical/High findings (see llm/enrich.py); tickets
          # fall back to today's templated description either way.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: gozu-github-action
