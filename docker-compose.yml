# Pinned explicitly - otherwise docker compose derives the project name
# (and so every container/volume/network name) from the compose file's
# parent directory name, which for a pip install is ~/.gozu/stack/ (see
# cli/stack/files.py), not a checkout dir named after this repo.
name: gozu

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/admin-tools:latest
    # The official one-box dev server: in-memory/SQLite persistence, no
    # separate Temporal database needed. Not for production use, but this
    # is a local/dev stack - see README's Phase 1 section.
    entrypoint: ["temporal", "server", "start-dev", "--ip", "0.0.0.0"]
    restart: unless-stopped
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
      - "${TEMPORAL_UI_PORT:-8233}:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 5s
      retries: 10

  sonarqube:
    image: sonarqube:community
    profiles: ["sonarqube-local"]
    restart: unless-stopped
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      # wget isn't in this image anymore (removed as of the current
      # sonarqube:community base) - confirmed live it just fails every
      # attempt with "wget: not found", so the container never reports
      # healthy even once SonarQube itself is genuinely up. curl is.
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    # Lets scanner/client.py's resolve_container_host() reach a host-side
    # "local" SonarQube (config.sonar_host_url=http://localhost:PORT) via
    # host.docker.internal - built into Docker Desktop (macOS/Windows)
    # already; this entry is what makes the same hostname resolve on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TEMPORAL_HOST: temporal:7233
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy

  receiver:
    build: .
    # Reuses the worker's image/Dockerfile - same dependencies already
    # cover Flask/config.store/the Temporal client, so there's nothing
    # receiver-specific to install; just run a different module.
    command: ["python", "-m", "receiver.app"]
    profiles: ["webhook"]
    restart: unless-stopped
    env_file: .env
    ports:
      - "${RECEIVER_PORT:-5000}:5000"
    environment:
      TEMPORAL_HOST: temporal:7233
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
